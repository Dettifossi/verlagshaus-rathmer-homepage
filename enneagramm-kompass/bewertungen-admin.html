<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kompass Admin – Bewertungen</title>
<style>
  body { font-family: Georgia, serif; background: #faf8f4; margin: 0; padding: 2rem 1rem; color: #333; }
  .box { max-width: 560px; margin: 0 auto; }
  h1 { color: #8a6a1a; font-size: 1.3rem; margin: 0 0 1.5rem; }
  #login-bereich { background: #fff; border: 2px solid #c9a84c; border-radius: 12px; padding: 2rem; }
  input { width: 100%; box-sizing: border-box; padding: .7rem 1rem; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem; margin-bottom: 1rem; font-family: Georgia, serif; }
  button { background: #8a6a1a; color: #fff; border: none; padding: .85rem 2rem; border-radius: 8px; font-size: 1rem; cursor: pointer; width: 100%; }
  button:hover { background: #6b520f; }
  .karte { background: #fff; border: 1px solid #e0d5b0; border-radius: 10px; padding: 1.2rem 1.4rem; margin-bottom: 1rem; }
  .karte-kopf { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }
  .sterne { color: #c9a84c; font-size: 1.3rem; }
  .datum { color: #999; font-size: .8rem; white-space: nowrap; }
  .kommentar { margin: .6rem 0 1rem; color: #444; font-size: .95rem; line-height: 1.5; font-style: italic; }
  .aktionen { display: flex; gap: .6rem; }
  .btn-ok { background: #4caf50; font-size: .9rem; padding: .5rem 1.2rem; width: auto; }
  .btn-ok:hover { background: #388e3c; }
  .btn-del { background: #e53935; font-size: .9rem; padding: .5rem 1.2rem; width: auto; }
  .btn-del:hover { background: #b71c1c; }
  .leer { color: #888; font-style: italic; text-align: center; padding: 2rem 0; }
  .abschnitt-titel { color: #8a6a1a; font-size: 1rem; margin: 1.8rem 0 .8rem; font-weight: bold; border-bottom: 1px solid #e0d5b0; padding-bottom: .4rem; }
  .meldung { padding: .6rem 1rem; border-radius: 6px; margin-bottom: 1rem; font-size: .9rem; display: none; }
  .meldung.ok { background: #f0faf0; border: 1px solid #4caf50; color: #2e7d32; }
  .meldung.err { background: #fff3f3; border: 1px solid #e57373; color: #c62828; }
</style>
</head>
<body>
<div class="box">
  <h1>⭐ Kompass Admin – Bewertungen</h1>

  <div id="admin-bereich">
    <div class="meldung" id="meldung"></div>

    <div class="abschnitt-titel">Ausstehend (noch nicht freigegeben)</div>
    <div id="wartend-liste"><div class="leer">Wird geladen…</div></div>

    <div class="abschnitt-titel">Freigegeben (öffentlich sichtbar)</div>
    <div id="freigegeben-liste"><div class="leer">Wird geladen…</div></div>
  </div>
</div>

<script>
const KEY       = '$2a$10$LNlgIJOGbl6mnMlsX.luWuOkm/0og9HUbwLyoqdb9hHh9Uk9hbt6O';
const BIN_WART  = '6a573182f5f4af5e299123ac';
const BIN_FREI  = '6a573185da38895dfe5f9c4b';
const ADMIN     = 'rathmer9';
const API       = 'https://api.jsonbin.io/v3/b/';

let wartend = [], freigegeben = [];

laden();

async function holen(bin) {
  const r = await fetch(API + bin + '/latest', { headers: { 'X-Master-Key': KEY } });
  const d = await r.json();
  const rec = d.record;
  if (Array.isArray(rec)) return rec;
  if (rec && Array.isArray(rec.reviews)) return rec.reviews;
  return [];
}

async function speichern(bin, daten) {
  await fetch(API + bin, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json', 'X-Master-Key': KEY },
    body: JSON.stringify({ reviews: daten })
  });
}

async function laden() {
  document.getElementById('wartend-liste').innerHTML = '<div class="leer">Wird geladen…</div>';
  document.getElementById('freigegeben-liste').innerHTML = '<div class="leer">Wird geladen…</div>';
  try {
    [wartend, freigegeben] = await Promise.all([holen(BIN_WART), holen(BIN_FREI)]);
    rendern();
  } catch(e) {
    zeigeInfo('Ladefehler: ' + e.message, false);
  }
}

function rendern() {
  document.getElementById('wartend-liste').innerHTML = wartend.length
    ? wartend.map((b, i) => karte(b, i, true)).join('')
    : '<div class="leer">Keine ausstehenden Bewertungen.</div>';
  document.getElementById('freigegeben-liste').innerHTML = freigegeben.length
    ? freigegeben.map((b, i) => karte(b, i, false)).join('')
    : '<div class="leer">Noch keine freigegebenen Bewertungen.</div>';
}

function karte(b, i, ausstehend) {
  const sterne = '★'.repeat(b.sterne || 0) + '☆'.repeat(5 - (b.sterne || 0));
  const datum = b.datum ? new Date(b.datum).toLocaleDateString('de-DE') : '';
  const kommentar = (b.kommentar || b.text) ? `<div class="kommentar">"${b.kommentar || b.text}"</div>` : '';
  const aktionen = ausstehend
    ? `<button class="btn-ok" onclick="freigeben(${i})">✓ Freigeben</button>
       <button class="btn-del" onclick="loeschen(${i}, true)">✕ Löschen</button>`
    : `<button class="btn-del" onclick="loeschen(${i}, false)">✕ Löschen</button>`;
  return `<div class="karte">
    <div class="karte-kopf">
      <span class="sterne">${sterne}</span>
      <span class="datum">${datum}</span>
    </div>
    ${kommentar}
    <div class="aktionen">${aktionen}</div>
  </div>`;
}

async function freigeben(i) {
  const b = wartend.splice(i, 1)[0];
  freigegeben.unshift(b);
  rendern();
  try {
    await Promise.all([speichern(BIN_WART, wartend), speichern(BIN_FREI, freigegeben)]);
    zeigeInfo('Bewertung freigegeben.', true);
  } catch(e) { zeigeInfo('Fehler: ' + e.message, false); }
}

async function loeschen(i, ausWartend) {
  if (ausWartend) wartend.splice(i, 1);
  else freigegeben.splice(i, 1);
  rendern();
  try {
    await speichern(ausWartend ? BIN_WART : BIN_FREI, ausWartend ? wartend : freigegeben);
    zeigeInfo('Bewertung gelöscht.', true);
  } catch(e) { zeigeInfo('Fehler: ' + e.message, false); }
}

function zeigeInfo(text, ok) {
  const el = document.getElementById('meldung');
  el.textContent = text;
  el.className = 'meldung ' + (ok ? 'ok' : 'err');
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 3000);
}

function zeigeMeldung(id, show) {
  document.getElementById(id).style.display = show ? 'block' : 'none';
}
</script>
</body>
</html>
